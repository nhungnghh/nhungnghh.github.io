<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.name }}
    {% else %}
      {{ site.name }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}"
  >

  <!-- Main CSS -->
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">

  <!-- Apply saved theme before page renders -->
  <script>
    (function () {
      const savedTheme = localStorage.getItem("theme");

      if (savedTheme) {
        document.documentElement.setAttribute("data-theme", savedTheme);
      } else {
        const prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)"
        ).matches;

        document.documentElement.setAttribute(
          "data-theme",
          prefersDark ? "dark" : "light"
        );
      }
    })();
  </script>
</head>


<body>

  <!-- =====================================================
       HEADER
       ===================================================== -->

  <header class="site-header">

    <div class="header-container">

      <!-- Personal branding -->
      <div class="terminal-brand">

        <a href="{{ '/' | relative_url }}" class="terminal-title">
          <span class="terminal-prompt">&gt;</span>
          <span class="terminal-name">Nghiem Nhung</span>
          <span class="terminal-cursor">_</span>
        </a>

      </div>


      <!-- Navigation -->
      <nav class="site-nav">

        <a href="{{ '/' | relative_url }}">
          Blog
        </a>

        <a href="{{ '/about/' | relative_url }}">
          About me
        </a>

        <!-- Theme Toggle -->
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle theme"
          title="Switch theme"
        >
          ◐
        </button>

      </nav>

    </div>

  </header>


  <!-- =====================================================
       MAIN CONTENT
       ===================================================== -->

  <main class="page-container">

    {{ content }}

  </main>


  <!-- =====================================================
       FOOTER
       ===================================================== -->

  <footer class="site-footer">

    <div class="footer-container">

      <p>
        © {{ site.time | date: "%Y" }}
        {{ site.name | default: "Nghiem Nhung" }}
      </p>

      <p class="footer-description">
        Threat Intelligence · Malware Analysis · DFIR · Reverse Engineering
      </p>

    </div>

  </footer>


  <!-- =====================================================
       LIGHT / DARK MODE
       ===================================================== -->

  <script>
    const themeToggle = document.getElementById("theme-toggle");

    if (themeToggle) {
      themeToggle.addEventListener("click", function () {

        const currentTheme =
          document.documentElement.getAttribute("data-theme");

        const newTheme =
          currentTheme === "dark"
            ? "light"
            : "dark";

        document.documentElement.setAttribute(
          "data-theme",
          newTheme
        );

        localStorage.setItem(
          "theme",
          newTheme
        );

      });
    }
  </script>

</body>

</html>
```
