<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} | {{ site.name }}
    {% else %}
      {{ site.name }}
    {% endif %}
  </title>

  <meta
    name="description"
    content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}"
  >

  <!-- Main stylesheet -->
  <link
    rel="stylesheet"
    type="text/css"
    href="{{ '/style.css' | relative_url }}"
  >

</head>

<body>

  <!-- =========================
       Header
       ========================= -->
  <header class="site-header">

    <div class="container header-inner">

      <div class="site-brand">

        <a class="site-title" href="{{ '/' | relative_url }}">
          {{ site.name | default: "Nghiem Nhung" }}
        </a>

        <p class="site-description">
          {{ site.description | default: "Security Analysis • Threat Intelligence • Malware Analysis" }}
        </p>

      </div>

      <nav class="site-nav">

        <a href="{{ '/' | relative_url }}">
          Blog
        </a>

        <a href="{{ '/about' | relative_url }}">
          About
        </a>

      </nav>

    </div>

  </header>


  <!-- =========================
       Main Content
       ========================= -->
  <main class="container main-content">

    {{ content }}

  </main>


  <!-- =========================
       Footer
       ========================= -->
  <footer class="site-footer">

    <div class="container">

      <p>
        © {{ site.time | date: "%Y" }}
        {{ site.name | default: "Nghiem Nhung" }}
      </p>

      <p class="footer-note">
        Cybersecurity • Threat Intelligence • Reverse Engineering
      </p>

    </div>

  </footer>

</body>

</html>
